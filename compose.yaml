name: video2robot
x-backend: &backend
  image: video2robot-backend:dev
  build:
    context: .
    dockerfile: infra/Dockerfile
  environment: &environment
    DATABASE_URL: postgresql+psycopg://video2robot:video2robot@postgres:5432/video2robot
    REDIS_URL: redis://redis:6379/0
    S3_ENDPOINT: http://minio:9000
    S3_PUBLIC_ENDPOINT: http://localhost:59000
    S3_ACCESS_KEY: local-video2robot
    S3_SECRET_KEY: local-video2robot-secret
    S3_BUCKET: video2robot
    INFERENCE_MODE: ${INFERENCE_MODE:-fixture}
    MODEL_API_KEY: ${MODEL_API_KEY:-}
    MUSE_MODEL: ${MUSE_MODEL:-muse-spark-1.3}
    SAM_MODEL: ${SAM_MODEL:-sam-3.1}
    WEB_ORIGIN: http://127.0.0.1:53000
  volumes: [".:/app"]
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    minio:
      condition: service_started
services:
  postgres:
    image: postgres:16.9-alpine
    environment:
      POSTGRES_USER: video2robot
      POSTGRES_PASSWORD: video2robot
      POSTGRES_DB: video2robot
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U video2robot"]
      interval: 3s
      retries: 30
  redis:
    image: redis:7.4.3-alpine
    ports: ["127.0.0.1:56379:6379"]
    volumes: ["redis:/data"]
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 30
  minio:
    build:
      context: .
      dockerfile: infra/Minio.Dockerfile
    environment:
      MINIO_ROOT_USER: local-video2robot
      MINIO_ROOT_PASSWORD: local-video2robot-secret
      MINIO_API_CORS_ALLOW_ORIGIN: http://127.0.0.1:53000
    command: server /data --console-address :9001
    ports: ["127.0.0.1:59000:9000", "127.0.0.1:59001:9001"]
    volumes: ["minio:/data"]
  init:
    <<: *backend
    command: ["python", "-m", "scripts.bootstrap"]
  api:
    <<: *backend
    ports: ["127.0.0.1:58000:8000"]
    depends_on:
      init:
        condition: service_completed_successfully
  worker:
    <<: *backend
    command: ["rq", "worker", "--url", "redis://redis:6379/0", "video2robot"]
    depends_on:
      init:
        condition: service_completed_successfully
  dispatcher:
    <<: *backend
    command: ["python", "-m", "apps.api.orchestration"]
    depends_on:
      init:
        condition: service_completed_successfully
volumes:
  postgres:
  redis:
  minio:

